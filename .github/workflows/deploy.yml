name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Type check
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: [self-hosted, windows, deploy]

    steps:
      # A previous run's live process can still be holding files open (e.g.
      # esbuild.exe), which makes actions/checkout's directory-clean step
      # fail with EPERM — confirmed live. deploy-service.ps1 also stops and
      # restarts the service later, but by then checkout has already tried
      # and failed, so it has to happen here too, first.
      - name: Stop the previous run of the live service
        shell: powershell
        run: |
          $owner = (Get-NetTCPConnection -LocalPort 3458 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty OwningProcess)
          if ($owner) {
            Write-Output "Stopping process on port 3458 (PID $owner) before checkout"
            Stop-Process -Id $owner -Force
            Start-Sleep -Seconds 2
          }

      # actions/checkout authenticates with GitHub's own ephemeral
      # GITHUB_TOKEN and checks out into $env:GITHUB_WORKSPACE, a path the
      # runner's own service account already has full access to — unlike
      # C:\Users\User\desk-api, which NT AUTHORITY\NetworkService (the
      # identity this runner service runs as) cannot read at all.
      - uses: actions/checkout@v7

      # .env is gitignored, so it never comes down with checkout — without
      # it the service starts with no DATABASE_URL/API keys/PORT and never
      # binds, which is why the health check below was timing out with no
      # other error. DOTENV_CONTENT holds the same file's full contents.
      - name: Write environment file
        shell: powershell
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV_CONTENT }}
        run: |
          if (-not $env:DOTENV_CONTENT) { throw "DOTENV_CONTENT secret is not set for this repo." }
          Set-Content -Path "$env:GITHUB_WORKSPACE\.env" -Value $env:DOTENV_CONTENT

      - name: Deploy to the live service
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\deploy-service.ps1" `
            -RepoPath "$env:GITHUB_WORKSPACE" `
            -Port 3458 `
            -StartCommand "start"
