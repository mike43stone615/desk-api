# Builds, tests and packs the JavaScript client (sdk/typescript). Run by hand from the Actions tab when a new version is ready
# (bump the version in sdk/typescript/package.json and src/index.ts, and add a line to sdk/typescript/CHANGELOG.md first).
# The packed .tgz is attached to the run. It is published to npm only when a repository secret named NPM_TOKEN exists.
name: SDK release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run src/__tests__/sdk.test.ts
      - run: npx tsc -p sdk/typescript/tsconfig.json
      - name: Pack
        working-directory: sdk/typescript
        run: |
          cp ../README.md ./README.md   # the package README lives one folder up, beside the samples
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: desk-api-library-package
          path: sdk/typescript/*.tgz
      - name: Publish (only when NPM_TOKEN is set)
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: sdk/typescript
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
