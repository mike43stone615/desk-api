services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  compliance-os:
    build: ./compliance-os
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/compliance_os
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"

  registry-api:
    build: ./registry-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/desk_registry
      DESK_REGISTRY_SYNC_SECRET: ${REGISTRY_API_SECRET:?required}
      PORT: "3456"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3456:3456"

volumes:
  postgres_data:
