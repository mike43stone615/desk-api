name = "desk-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "app.deskbusiness.co/*", zone_name = "deskbusiness.co" },
  { pattern = "api.deskbusiness.co/*", zone_name = "deskbusiness.co" }
]
# ── D1 database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "desk-api-db"
database_id = "ef1398b2-bc97-4171-ae0f-07f9553dd704"

# ── R2 object storage ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "desk-api-storage"

# ── Non-sensitive variables ───────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
# Session token lifetime in hours (default 30 days)
SESSION_DURATION_HOURS = "720"
# Password reset token lifetime in minutes
RESET_TOKEN_DURATION_MINUTES = "60"
OPENAI_MODEL = "gpt-4.1-mini"
EMAIL_FROM = "noreply@deskbusiness.co"
APP_BASE_URL = "https://app.deskbusiness.co"
CONFIRMATION_TOKEN_DURATION_MINUTES = "1440"
ADMIN_EMAILS = "mike43stone615@gmail.com"

# URLs for backend services — set to Railway deployment URLs after deploying.
# Leave empty until deployed; integration routes return 503 when unset.
# IMPORTANT: must NOT point to api.deskbusiness.co (would create a loop).
COMPLIANCE_OS_URL = ""
REGISTRY_API_URL = ""

# ── Secrets (set via `wrangler secret put <NAME>`) ───────────────────────────
# Required secrets:
#   OPENAI_API_KEY         — for business classification AI
#   GOOGLE_PLACES_API_KEY  — for city/place search
#   REGISTRY_API_SECRET    — shared secret for registry upsert endpoint
#   COMPLIANCE_OS_API_KEY  — API key for compliance-os admin routes
#
# Optional secrets:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS — for transactional email
#   OPENAI_MODEL           — OpenAI model override (default: gpt-4.1-mini)

# ── Local development ─────────────────────────────────────────────────────────
[env.local]
# Local vars can override production vars during `wrangler dev`
[env.local.vars]
ENVIRONMENT = "local"

# ── Scheduled triggers ────────────────────────────────────────────────────────
# Runs deleteExpiredSessions() daily at 02:00 UTC.
[triggers]
crons = ["0 2 * * *"]

# ── Cloudflare Pages integration ──────────────────────────────────────────────
# To serve the Flutter web app from Cloudflare Pages with this Worker as the
# API backend, deploy the Flutter build to Pages and add this Worker as a
# "Pages Functions" binding or use the Pages _worker.js approach.
# See docs/CLOUDFLARE-DEPLOY.md for full instructions.

[assets]
directory = "../desk_business/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/auth/*", "/functions/v1/*", "/integrations/*", "/health", "/readiness"]
