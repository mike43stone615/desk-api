<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk API Library</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar" id="topbar" hidden>
    <button type="button" class="back-btn" id="back-btn" hidden aria-label="Back" title="Back">&larr;</button>
    <a class="brand" id="brand-link" href="https://www.deskbusiness.co" target="_blank" rel="noopener" aria-label="Open Desk website">
      <img src="/desk_logo.png" alt="" width="32" height="32" />
      <span>Desk</span>
    </a>
    <nav id="nav"></nav>
    <div class="authbox" id="authbox"></div>
  </div>
  <div id="app"></div>
  <!-- Plain (non-module) script so it runs and sets up window.Sentry before
       the deferred module script below executes -- app.js calls Sentry.init
       at its own top level. Error-capture only, no tracing/replay bundle
       (this app doesn't need those, and the plain bundle is far smaller).
       Pinned to an exact version AND to its content hash (integrity=): if the CDN ever served a different file, the
       browser refuses to run it. When bumping the version, recompute the hash (see web_app/README.md).
       Matches the Flutter app's own Sentry setup (see lib/main.dart) with
       its own separate project, so a browser error doesn't get miscounted
       against the phone/desktop app's error rate. -->
  <script src="https://browser.sentry-cdn.com/10.15.0/bundle.min.js" integrity="sha384-PeBKZgicpCcvNw2FCZjty5E+c1yPn1O2rL6YKozLvNJSUeD8nlkugwLFdLauBc1q" crossorigin="anonymous"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
